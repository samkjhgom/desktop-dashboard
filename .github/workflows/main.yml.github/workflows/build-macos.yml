
name: Build macOS App

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r desktop_live_macos/requirements.txt
          python -m pip install pyinstaller

      - name: Check source and Tkinter
        run: |
          python -m py_compile desktop_live_macos/desktop_monitor.py
          python -c "import tkinter; print('Tkinter available')"

      - name: Build macOS application
        run: |
          python -m PyInstaller \
            --noconfirm \
            --clean \
            --windowed \
            --onedir \
            --name DesktopDashboard \
            --add-data "desktop_live_macos/world_countries.json:." \
            desktop_live_macos/desktop_monitor.py

      - name: Package application
        run: |
          cd dist
          ditto -c -k --keepParent \
            DesktopDashboard.app \
            DesktopDashboard-macOS.zip

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: DesktopDashboard-macOS
          path: dist/DesktopDashboard-macOS.zip
